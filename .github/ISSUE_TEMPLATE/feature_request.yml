name: Feature Request
description: Propose a new component, variant, or capability
title: '[Feature]: '
labels: ['enhancement', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a component, design token, or feature? Let us know!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or missing use case?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Component API
      description: Describe the solution, component anatomy, or desired TypeScript API.
    validations:
      required: true
  - type: textarea
    id: a11y
    attributes:
      label: Accessibility & Keyboard Considerations
      description: How should this component behave with keyboard navigation and screen readers?
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other solutions or existing libraries have you considered?
    validations:
      required: false
